name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore src/AadharLocation.Api/AadharLocation.Api.csproj

      - name: Publish API
        run: dotnet publish src/AadharLocation.Api/AadharLocation.Api.csproj --configuration Release --output ./publish --no-restore

      - name: Install EF Tools
        run: dotnet tool install --global dotnet-ef --version 9.*

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $env:GITHUB_PATH

      - name: Run Database Migrations
        env:
          ConnectionStrings__Default: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          dotnet ef database update `
            --project src/AadharLocation.Api `
            --configuration Release `
            --no-build

      - name: Create .env file
        run: |
          "${{ secrets.ENV_FILE }}" | Out-File -FilePath ./publish/.env -Encoding utf8

      - name: Create app_offline.htm
        run: |
          New-Item -ItemType Directory -Force -Path ./offline
          "App is being updated." | Out-File -FilePath ./offline/app_offline.htm -Encoding utf8

      - name: Upload app_offline.htm to stop IIS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./offline/
          server-dir: /

      - name: Wait for IIS to release file locks
        run: Start-Sleep -Seconds 20

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /

      - name: Bring app back online
        continue-on-error: true
        run: |
          $ftpRequest = [System.Net.FtpWebRequest]::Create("ftp://${{ secrets.FTP_HOST }}/app_offline.htm")
          $ftpRequest.Method = [System.Net.WebRequestMethods+Ftp]::DeleteFile
          $ftpRequest.Credentials = New-Object System.Net.NetworkCredential("${{ secrets.FTP_USERNAME }}", "${{ secrets.FTP_PASSWORD }}")
          $ftpRequest.GetResponse() | Out-Null
