name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore AadharLocation.slnx

      - name: Publish API
        run: dotnet publish src/AadharLocation.Api/AadharLocation.Api.csproj --configuration Release --output ./publish --no-restore

      - name: Install EF Tools
        run: dotnet tool install --global dotnet-ef

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $env:GITHUB_PATH

      - name: Debug Connection String
        run: |
          echo "Connection: ${{ secrets.DB_CONNECTION_STRING }}" | Select-String "Host="

      - name: Run Database Migrations
        env:
          ConnectionStrings__Default: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          dotnet ef database update `
            --project src/AadharLocation.Api `
            --configuration Release `
            --no-build

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" | Out-File -FilePath ./publish/.env -Encoding utf8
      
      - name: Stop IIS App Pool via FTP marker
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /
          dangerous-clean-slate: false
        continue-on-error: true

      - name: Wait for App Pool to release files
        run: Start-Sleep -Seconds 15

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /

      - name: Bring app back online
        run: |
          $ftpRequest = [System.Net.FtpWebRequest]::Create("ftp://${{ secrets.FTP_HOST }}/app_offline.htm")
          $ftpRequest.Method = [System.Net.WebRequestMethods+Ftp]::DeleteFile
          $ftpRequest.Credentials = New-Object System.Net.NetworkCredential("${{ secrets.FTP_USERNAME }}", "${{ secrets.FTP_PASSWORD }}")
          $ftpRequest.GetResponse() | Out-Null
