<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; overflow: hidden; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    var _map         = null;
    var _circle      = null;
    var _marker      = null;

    var DARK_STYLES = [
      { elementType: 'geometry',           stylers: [{ color: '#1a1a2e' }] },
      { elementType: 'labels.text.stroke', stylers: [{ color: '#1a1a2e' }] },
      { elementType: 'labels.text.fill',   stylers: [{ color: '#9ca3af' }] },
      { featureType: 'road',               elementType: 'geometry',           stylers: [{ color: '#374151' }] },
      { featureType: 'road',               elementType: 'labels.text.fill',   stylers: [{ color: '#6b7280' }] },
      { featureType: 'water',              elementType: 'geometry',           stylers: [{ color: '#0f172a' }] },
      { featureType: 'water',              elementType: 'labels.text.fill',   stylers: [{ color: '#374151' }] },
      { featureType: 'poi',                elementType: 'geometry',           stylers: [{ color: '#1e293b' }] },
      { featureType: 'poi',                elementType: 'labels.text.fill',   stylers: [{ color: '#6b7280' }] },
      { featureType: 'poi.park',           elementType: 'geometry',           stylers: [{ color: '#1e2d1e' }] },
      { featureType: 'administrative',     elementType: 'geometry.stroke',    stylers: [{ color: '#374151' }] },
      { featureType: 'transit',            elementType: 'geometry',           stylers: [{ color: '#1e293b' }] }
    ];

    function initMap() {
      _map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: 20.5937, lng: 78.9629 },
        zoom: 5,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,
        zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_CENTER }
      });

      _map.addListener('click', function (e) {
        window.chrome.webview.postMessage(JSON.stringify({
          type: 'MapClicked',
          latitude:  e.latLng.lat(),
          longitude: e.latLng.lng()
        }));
      });

      window.chrome.webview.postMessage(JSON.stringify({ type: 'MapReady' }));
    }

    function applyTheme(theme) {
      if (!_map) return;
      _map.setOptions({ styles: theme === 'dark' ? DARK_STYLES : [] });
    }

    function createOrUpdateOverlay(lat, lng, radiusMeters) {
      var center = { lat: lat, lng: lng };

      if (_circle) {
        _circle.setCenter(center);
        _circle.setRadius(radiusMeters);
      } else {
        _circle = new google.maps.Circle({
          map: _map,
          center: center,
          radius: radiusMeters,
          fillColor: '#2DD4BF',
          fillOpacity: 0.18,
          strokeColor: '#2DD4BF',
          strokeOpacity: 0.9,
          strokeWeight: 2.5,
          clickable: false
        });
      }

      if (_marker) {
        _marker.setPosition(center);
      } else {
        _marker = new google.maps.Marker({
          map: _map,
          position: center,
          draggable: true,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 9,
            fillColor: '#ffffff',
            fillOpacity: 1,
            strokeColor: '#2DD4BF',
            strokeWeight: 2.5
          },
          zIndex: 10
        });

        _marker.addListener('dragend', function (e) {
          window.chrome.webview.postMessage(JSON.stringify({
            type: 'MarkerDragged',
            latitude:  e.latLng.lat(),
            longitude: e.latLng.lng()
          }));
        });
      }
    }

    function zoomToGeofence() {
      if (!_circle) return;
      _map.fitBounds(_circle.getBounds(), 80);
    }

    // ── Message handler ───────────────────────────────────────────────────────

    window.chrome.webview.addEventListener('message', function (e) {
      var msg;
      try { msg = JSON.parse(e.data); } catch (err) { return; }

      switch (msg.type) {
        case 'InitMap':
          applyTheme(msg.theme);
          createOrUpdateOverlay(msg.latitude, msg.longitude, msg.radiusMeters);
          break;

        case 'UpdateOverlay':
          createOrUpdateOverlay(msg.latitude, msg.longitude, msg.radiusMeters);
          break;

        case 'ZoomToGeofence':
          zoomToGeofence();
          break;
      }
    });
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key={{API_KEY}}&callback=initMap&loading=async"
    async defer>
  </script>
</body>
</html>
