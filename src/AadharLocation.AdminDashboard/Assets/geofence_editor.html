<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; overflow: hidden; }

    #map-type-ctrl {
      position: absolute;
      bottom: 24px;
      left: 12px;
      z-index: 10;
      display: flex;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
    }
    #map-type-ctrl button {
      padding: 6px 12px;
      border: none;
      cursor: pointer;
      background: rgba(30,30,30,0.88);
      color: #d1d5db;
      transition: background 0.15s, color 0.15s;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    #map-type-ctrl button:last-child { border-right: none; }
    #map-type-ctrl button:hover { background: rgba(60,60,60,0.95); color: #fff; }
    #map-type-ctrl button.active { background: #3b82f6; color: #fff; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="map-type-ctrl">
    <button id="btn-satellite" class="active" onclick="setMapType('satellite')">Satellite</button>
    <button id="btn-hybrid"    onclick="setMapType('hybrid')">Hybrid</button>
    <button id="btn-road"      onclick="setMapType('roadmap')">Road</button>
  </div>

  <script>
    var _map         = null;
    var _circle      = null;
    var _marker      = null;
    var _currentTheme = 'light';

    var DARK_STYLES = [
      { elementType: 'geometry',           stylers: [{ color: '#1a1a2e' }] },
      { elementType: 'labels.text.stroke', stylers: [{ color: '#1a1a2e' }] },
      { elementType: 'labels.text.fill',   stylers: [{ color: '#9ca3af' }] },
      { featureType: 'road',               elementType: 'geometry',           stylers: [{ color: '#374151' }] },
      { featureType: 'road',               elementType: 'labels.text.fill',   stylers: [{ color: '#6b7280' }] },
      { featureType: 'water',              elementType: 'geometry',           stylers: [{ color: '#0f172a' }] },
      { featureType: 'water',              elementType: 'labels.text.fill',   stylers: [{ color: '#374151' }] },
      { featureType: 'poi',                elementType: 'geometry',           stylers: [{ color: '#1e293b' }] },
      { featureType: 'poi',                elementType: 'labels.text.fill',   stylers: [{ color: '#6b7280' }] },
      { featureType: 'poi.park',           elementType: 'geometry',           stylers: [{ color: '#1e2d1e' }] },
      { featureType: 'administrative',     elementType: 'geometry.stroke',    stylers: [{ color: '#374151' }] },
      { featureType: 'transit',            elementType: 'geometry',           stylers: [{ color: '#1e293b' }] }
    ];

    function setMapType(type) {
      if (!_map) return;
      _map.setMapTypeId(type);
      document.getElementById('btn-satellite').classList.toggle('active', type === 'satellite');
      document.getElementById('btn-hybrid').classList.toggle('active',    type === 'hybrid');
      document.getElementById('btn-road').classList.toggle('active',      type === 'roadmap');
      if (type === 'roadmap') {
        _map.setOptions({ styles: _currentTheme === 'dark' ? DARK_STYLES : [] });
      } else {
        _map.setOptions({ styles: [] });
      }
    }

    function initMap() {
      _map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: 20.5937, lng: 78.9629 },
        zoom: 5,
        mapTypeId: 'satellite',
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,
        zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_CENTER }
      });

      _map.addListener('click', function (e) {
        window.chrome.webview.postMessage(JSON.stringify({
          type: 'MapClicked',
          latitude:  e.latLng.lat(),
          longitude: e.latLng.lng()
        }));
      });

      window.chrome.webview.postMessage(JSON.stringify({ type: 'MapReady' }));
    }

    function applyTheme(theme) {
      if (!_map) return;
      _currentTheme = theme;
      var isRoad = _map.getMapTypeId() === 'roadmap';
      _map.setOptions({ styles: (isRoad && theme === 'dark') ? DARK_STYLES : [] });
    }

    function createOrUpdateOverlay(lat, lng, radiusMeters) {
      var center = { lat: lat, lng: lng };

      if (_circle) {
        _circle.setCenter(center);
        _circle.setRadius(radiusMeters);
      } else {
        _circle = new google.maps.Circle({
          map: _map,
          center: center,
          radius: radiusMeters,
          fillColor: '#2DD4BF',
          fillOpacity: 0.18,
          strokeColor: '#2DD4BF',
          strokeOpacity: 0.9,
          strokeWeight: 2.5,
          clickable: false
        });
      }

      if (_marker) {
        _marker.setPosition(center);
      } else {
        _marker = new google.maps.Marker({
          map: _map,
          position: center,
          draggable: true,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 9,
            fillColor: '#ffffff',
            fillOpacity: 1,
            strokeColor: '#2DD4BF',
            strokeWeight: 2.5
          },
          zIndex: 10
        });

        _marker.addListener('dragend', function (e) {
          window.chrome.webview.postMessage(JSON.stringify({
            type: 'MarkerDragged',
            latitude:  e.latLng.lat(),
            longitude: e.latLng.lng()
          }));
        });
      }
    }

    function zoomToGeofence() {
      if (!_circle) return;
      _map.fitBounds(_circle.getBounds(), 80);
    }

    // ── Message handler ───────────────────────────────────────────────────────

    window.chrome.webview.addEventListener('message', function (e) {
      var msg;
      try { msg = JSON.parse(e.data); } catch (err) { return; }

      switch (msg.type) {
        case 'InitMap':
          applyTheme(msg.theme);
          createOrUpdateOverlay(msg.latitude, msg.longitude, msg.radiusMeters);
          break;

        case 'UpdateOverlay':
          createOrUpdateOverlay(msg.latitude, msg.longitude, msg.radiusMeters);
          break;

        case 'ZoomToGeofence':
          zoomToGeofence();
          break;
      }
    });
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key={{API_KEY}}&callback=initMap&loading=async"
    async defer>
  </script>
</body>
</html>
