<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; overflow: hidden; }

    #map-type-ctrl {
      position: absolute;
      bottom: 24px;
      left: 12px;
      z-index: 10;
      display: flex;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
    }
    #map-type-ctrl button {
      padding: 6px 12px;
      border: none;
      cursor: pointer;
      background: rgba(30,30,30,0.88);
      color: #d1d5db;
      transition: background 0.15s, color 0.15s;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    #map-type-ctrl button:last-child { border-right: none; }
    #map-type-ctrl button:hover { background: rgba(60,60,60,0.95); color: #fff; }
    #map-type-ctrl button.active { background: #3b82f6; color: #fff; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="map-type-ctrl">
    <button id="btn-satellite" class="active" onclick="setMapType('satellite')">Satellite</button>
    <button id="btn-hybrid"    onclick="setMapType('hybrid')">Hybrid</button>
    <button id="btn-road"      onclick="setMapType('roadmap')">Road</button>
  </div>

  <script>
    var _map = null;
    var _markers = {};
    var _infoWindow = null;
    var _mapReady = false;
    var _visibleIds = null; // null = all visible; array = only these machineIds
    var _currentTheme = 'light';

    var STATUS_COLORS = {
      'Online':  { bg: '#4ADE80', border: '#ffffff', glyph: '#166534' },
      'Offline': { bg: '#F87171', border: '#ffffff', glyph: '#7f1d1d' },
      'Idle':    { bg: '#FBBF24', border: '#ffffff', glyph: '#78350f' }
    };

    var DARK_STYLES = [
      { elementType: 'geometry',           stylers: [{ color: '#1a1a2e' }] },
      { elementType: 'labels.text.stroke', stylers: [{ color: '#1a1a2e' }] },
      { elementType: 'labels.text.fill',   stylers: [{ color: '#9ca3af' }] },
      { featureType: 'road',               elementType: 'geometry',           stylers: [{ color: '#374151' }] },
      { featureType: 'road',               elementType: 'labels.text.fill',   stylers: [{ color: '#6b7280' }] },
      { featureType: 'water',              elementType: 'geometry',           stylers: [{ color: '#0f172a' }] },
      { featureType: 'water',              elementType: 'labels.text.fill',   stylers: [{ color: '#374151' }] },
      { featureType: 'poi',                elementType: 'geometry',           stylers: [{ color: '#1e293b' }] },
      { featureType: 'poi',                elementType: 'labels.text.fill',   stylers: [{ color: '#6b7280' }] },
      { featureType: 'poi.park',           elementType: 'geometry',           stylers: [{ color: '#1e2d1e' }] },
      { featureType: 'administrative',     elementType: 'geometry.stroke',    stylers: [{ color: '#374151' }] },
      { featureType: 'transit',            elementType: 'geometry',           stylers: [{ color: '#1e293b' }] }
    ];

    function setMapType(type) {
      if (!_map) return;
      _map.setMapTypeId(type);
      document.getElementById('btn-satellite').classList.toggle('active', type === 'satellite');
      document.getElementById('btn-hybrid').classList.toggle('active',    type === 'hybrid');
      document.getElementById('btn-road').classList.toggle('active',      type === 'roadmap');
      // Road styles only relevant for roadmap type
      if (type === 'roadmap') {
        _map.setOptions({ styles: _currentTheme === 'dark' ? DARK_STYLES : [] });
      } else {
        _map.setOptions({ styles: [] });
      }
    }

    function initMap() {
      _map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: 20.5937, lng: 78.9629 },
        zoom: 5,
        mapTypeId: 'satellite',
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,
        zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_CENTER }
      });

      _infoWindow = new google.maps.InfoWindow();

      window.chrome.webview.postMessage(JSON.stringify({ type: 'MapReady' }));
    }

    function applyTheme(theme) {
      if (!_map) return;
      _currentTheme = theme;
      // Custom styles only affect roadmap type
      var isRoad = _map.getMapTypeId() === 'roadmap';
      _map.setOptions({ styles: (isRoad && theme === 'dark') ? DARK_STYLES : [] });
    }

    function createOrUpdateMarker(pin) {
      var colors = STATUS_COLORS[pin.status] || STATUS_COLORS['Idle'];

      if (_markers[pin.machineId]) {
        var existing = _markers[pin.machineId];
        existing.marker.setPosition({ lat: pin.latitude, lng: pin.longitude });
        existing.marker.setIcon(buildMarkerIcon(colors, pin.machineName, pin.operatorName));
        existing.pin = pin;
        return;
      }

      var isVisible = !_visibleIds || _visibleIds.indexOf(pin.machineId) !== -1;
      var marker = new google.maps.Marker({
        map: isVisible ? _map : null,
        position: { lat: pin.latitude, lng: pin.longitude },
        icon: buildMarkerIcon(colors, pin.machineName, pin.operatorName),
        optimized: false
      });

      marker.addListener('click', function () {
        window.chrome.webview.postMessage(JSON.stringify({
          type: 'MarkerClicked',
          machineId: pin.machineId
        }));
      });

      _markers[pin.machineId] = { marker: marker, pin: pin };
    }

    function escapeXml(s) {
      return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function buildMarkerIcon(colors, machineName, operatorName) {
      var hasOp = !!(operatorName && operatorName.trim());
      var DOT_R = 7, PAD = 6, LINE_H = 15, FSM = 11, FSO = 10;

      var labelW = Math.max(
        (machineName || '').length * 6.8,
        hasOp ? (operatorName || '').length * 6.2 : 0,
        50
      ) + PAD * 2;
      var labelH = (hasOp ? LINE_H * 2 : LINE_H) + PAD * 2;

      var svgW  = DOT_R * 2 + 6 + labelW;
      var svgH  = Math.max(DOT_R * 2 + 4, labelH + 4);
      var dotCX = DOT_R + 1;
      var dotCY = Math.round(svgH / 2);
      var boxX  = DOT_R * 2 + 4;
      var boxY  = Math.round((svgH - labelH) / 2);
      var tX    = boxX + PAD;
      var t1Y   = boxY + PAD + FSM;
      var t2Y   = t1Y + LINE_H;

      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + svgW + '" height="' + svgH + '">'
        + '<rect x="' + boxX + '" y="' + boxY + '" width="' + labelW + '" height="' + labelH
        + '" rx="4" fill="rgba(255,255,255,0.93)" stroke="#d1d5db" stroke-width="1"/>'
        + '<circle cx="' + dotCX + '" cy="' + dotCY + '" r="' + DOT_R
        + '" fill="' + colors.bg + '" stroke="white" stroke-width="2"/>'
        + '<text x="' + tX + '" y="' + t1Y + '" font-family="Arial,sans-serif" font-size="' + FSM
        + '" font-weight="700" fill="#111">' + escapeXml(machineName) + '</text>';
      if (hasOp) {
        svg += '<text x="' + tX + '" y="' + t2Y + '" font-family="Arial,sans-serif" font-size="' + FSO
          + '" fill="#6b7280">' + escapeXml(operatorName) + '</text>';
      }
      svg += '</svg>';

      return {
        url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
        anchor: new google.maps.Point(dotCX, dotCY),
        scaledSize: new google.maps.Size(svgW, svgH)
      };
    }

    function fitBounds(pins) {
      if (!pins || pins.length === 0) return;
      if (pins.length === 1) {
        _map.setCenter({ lat: pins[0].latitude, lng: pins[0].longitude });
        _map.setZoom(13);
        return;
      }
      var bounds = new google.maps.LatLngBounds();
      for (var i = 0; i < pins.length; i++) {
        bounds.extend({ lat: pins[i].latitude, lng: pins[i].longitude });
      }
      _map.fitBounds(bounds, { top: 60, right: 60, bottom: 60, left: 60 });
    }

    function clearAllMarkers() {
      for (var id in _markers) {
        _markers[id].marker.setMap(null);
      }
      _markers = {};
    }

    // ── Message handler ───────────────────────────────────────────────────────

    window.chrome.webview.addEventListener('message', function (e) {
      var msg;
      try { msg = JSON.parse(e.data); } catch (err) { return; }

      switch (msg.type) {
        case 'InitMap':
          applyTheme(msg.theme);
          break;

        case 'LoadPins':
          clearAllMarkers();
          if (msg.pins && msg.pins.length > 0) {
            for (var i = 0; i < msg.pins.length; i++) {
              createOrUpdateMarker(msg.pins[i]);
            }
            var pinsToFit = _visibleIds
              ? msg.pins.filter(function(p) { return _visibleIds.indexOf(p.machineId) !== -1; })
              : msg.pins;
            fitBounds(pinsToFit.length > 0 ? pinsToFit : msg.pins);
          }
          break;

        case 'SetVisiblePins':
          _visibleIds = msg.machineIds; // null = show all
          for (var id in _markers) {
            var show = !_visibleIds || _visibleIds.indexOf(parseInt(id)) !== -1;
            _markers[id].marker.setMap(show ? _map : null);
          }
          break;

        case 'UpdatePin':
          if (msg.pin) createOrUpdateMarker(msg.pin);
          break;

        case 'FocusPin':
          _map.panTo({ lat: msg.latitude, lng: msg.longitude });
          _map.setZoom(20);
          break;

        case 'FocusLocation':
          _map.panTo({ lat: msg.latitude, lng: msg.longitude });
          _map.setZoom(13);
          if (msg.label) {
            _infoWindow.setContent('<div style="color:#111;font-weight:600;">' + msg.label + '</div>');
            _infoWindow.setPosition({ lat: msg.latitude, lng: msg.longitude });
            _infoWindow.open(_map);
          }
          break;
      }
    });
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key={{API_KEY}}&callback=initMap&loading=async"
    async defer>
  </script>
</body>
</html>
